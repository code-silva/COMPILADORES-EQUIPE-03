site_name: PyToJava — Documentação Técnica
site_url: https://code-silva.github.io/COMPILADORES-EQUIPE-03/
theme:
  name: material
  language: pt-BR
  logo: img/pytojava-logo.svg
  favicon: img/pytojava-logo.svg
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alterar para o modo escuro

    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alterar para o modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/extra.css
  - stylesheets/pytojava.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Início: index.md
  - Glossário: GLOSSARY.md
  - Estrutura: estrutura.md
  - Compiladores:
    - Visão Geral: compiladores.md
    - Analisador Léxico:
      - Especificador Léxico: specs/lexico.md
      - Arquitetura do Scanner: arch/scanner.md
    - Analisador Sintático:
      - Visão Geral e API: parser/index.md
      - Árvore Sintática Abstrata (AST): parser/ast.md
      - Gramática e Precedência: parser/grammar.md
      - Erros Sintáticos e Casos de Borda: parser/errors.md
    - Analisador Semântico:
      - Tabela de Símbolos e Escopos: semantic/symbol_table.md
      - Analisador Semântico e Visitor: semantic/analyzer.md
      - Tipos e Compatibilidade: semantic/types.md
    - Gerador de Código:
      - Arquitetura do Gerador: codegen/architecture.md
      - Expressões e Literais: codegen/expressions.md
      - Controle de Fluxo: codegen/control_flow.md
    - Pipeline, CLI e Interface Web: usage.md
